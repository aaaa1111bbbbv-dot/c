name: Build Mijoz va Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Mijoz & Admin Apps
        run: |
          mkdir -p out

          # ==========================================
          # 1. MIJOZ APK (Qo'riqlash)
          # ==========================================
          mkdir -p mijoz/src/main/java/uz/kuzatuv/mijoz
          mkdir -p mijoz/src/main/res/values

          cat << 'EOF' > mijoz/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="uz.kuzatuv.mijoz"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:label="Qo'riqlash"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:keepScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > mijoz/src/main/java/uz/kuzatuv/mijoz/MainActivity.java
          package uz.kuzatuv.mijoz;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;

          public class MainActivity extends Activity {
              private static final String CONFIG_URL = "https://raw.githubusercontent.com/aaaa1111bbbbv-dot/c/main/config.json";
              private static final String DEFAULT_HASH = "e255464f8a5b58790f025541677996401531c4c57941b4081271124570548511"; // Alisa
              private SharedPreferences prefs;
              private LinearLayout rootLayout;
              private WebView webView;
              private TextView blockBanner;
              private Handler handler = new Handler(Looper.getMainLooper());
              private String remoteCodeHash = DEFAULT_HASH;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("QoriqlashPrefs", MODE_PRIVATE);

                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO}, 101);
                  }

                  rootLayout = new LinearLayout(this);
                  rootLayout.setOrientation(LinearLayout.VERTICAL);
                  rootLayout.setBackgroundColor(Color.parseColor("#0B0F19"));
                  setContentView(rootLayout);

                  blockBanner = new TextView(this);
                  blockBanner.setBackgroundColor(Color.parseColor("#B91C1C"));
                  blockBanner.setTextColor(Color.WHITE);
                  blockBanner.setPadding(32, 48, 32, 48);
                  blockBanner.setTextSize(16);
                  blockBanner.setTypeface(null, Typeface.BOLD);
                  blockBanner.setGravity(Gravity.CENTER);
                  blockBanner.setVisibility(View.GONE);
                  rootLayout.addView(blockBanner);

                  checkRemoteConfig(true);
                  startConfigLoop();
              }

              private void startConfigLoop() {
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          checkRemoteConfig(false);
                          handler.postDelayed(this, 15000);
                      }
                  }, 15000);
              }

              private void checkRemoteConfig(final boolean initial) {
                  new Thread(() -> {
                      try {
                          URL url = new URL(CONFIG_URL + "?t=" + System.currentTimeMillis());
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(6000);
                          conn.setReadTimeout(6000);
                          BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) sb.append(line);
                          reader.close();

                          JSONObject json = new JSONObject(sb.toString());
                          final boolean isActive = json.optBoolean("active", true);
                          final String remoteCode = json.optString("code", "Alisa");
                          final String message = json.optString("message", "");
                          remoteCodeHash = sha256(remoteCode);

                          runOnUiThread(() -> {
                              if (!isActive) {
                                  if (webView != null) webView.setVisibility(View.GONE);
                                  blockBanner.setVisibility(View.VISIBLE);
                                  blockBanner.setText(message.isEmpty() ? "Tizim administrator tomonidan vaqtincha to'xtatilgan!" : message);
                              } else {
                                  if (!message.isEmpty()) {
                                      blockBanner.setVisibility(View.VISIBLE);
                                      blockBanner.setText("ADMIN XABARI: " + message);
                                  } else {
                                      blockBanner.setVisibility(View.GONE);
                                  }
                                  if (initial) {
                                      verifyActivation();
                                  } else if (webView != null) {
                                      webView.setVisibility(View.VISIBLE);
                                  }
                              }
                          });
                      } catch (Exception e) {
                          if (initial) {
                              runOnUiThread(this::verifyActivation);
                          }
                      }
                  }).start();
              }

              private void verifyActivation() {
                  String savedHash = prefs.getString("auth_hash", "");
                  if (!savedHash.isEmpty() && (savedHash.equals(remoteCodeHash) || savedHash.equals(DEFAULT_HASH))) {
                      launchDashboard();
                      return;
                  }

                  LinearLayout authBox = new LinearLayout(this);
                  authBox.setOrientation(LinearLayout.VERTICAL);
                  authBox.setGravity(Gravity.CENTER);
                  authBox.setPadding(60, 120, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("QO'RIQLASH TIZIMI");
                  title.setTextColor(Color.parseColor("#38BDF8"));
                  title.setTextSize(22);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  authBox.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("\nIlovani faollashtirish uchun maxsus kalit so'zni kiriting:");
                  sub.setTextColor(Color.LTGRAY);
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);
                  authBox.addView(sub);

                  final EditText input = new EditText(this);
                  input.setHint("Faollashtirish kodi...");
                  input.setHintTextColor(Color.GRAY);
                  input.setTextColor(Color.WHITE);
                  input.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  input.setPadding(30, 30, 30, 30);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 40, 0, 40);
                  input.setLayoutParams(lp);
                  authBox.addView(input);

                  Button btn = new Button(this);
                  btn.setText("FAOLLASHTIRISH");
                  btn.setBackgroundColor(Color.parseColor("#0284C7"));
                  btn.setTextColor(Color.WHITE);
                  btn.setOnClickListener(v -> {
                      String entered = input.getText().toString().trim();
                      String h = sha256(entered);
                      if (h.equals(remoteCodeHash) || h.equals(DEFAULT_HASH)) {
                          prefs.edit().putString("auth_hash", h).apply();
                          rootLayout.removeView(authBox);
                          launchDashboard();
                      } else {
                          Toast.makeText(this, "Noto'g'ri kod! Qayta urinib ko'ring.", Toast.LENGTH_SHORT).show();
                      }
                  });
                  authBox.addView(btn);
                  rootLayout.addView(authBox);
              }

              private void launchDashboard() {
                  if (webView != null) {
                      webView.setVisibility(View.VISIBLE);
                      return;
                  }
                  webView = new WebView(this);
                  webView.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT));
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  String html = "<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'>" +
                          "<style>" +
                          "body{margin:0;background:#0b0f19;color:#fff;font-family:sans-serif;}" +
                          ".top{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#111827;border-bottom:1px solid #1f2937;}" +
                          ".btn{background:#0284c7;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-weight:bold;}" +
                          ".grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px;}" +
                          ".cam{position:relative;background:#000;border:2px solid #1e293b;border-radius:8px;overflow:hidden;aspect-ratio:16/10;transition:0.2s;}" +
                          ".cam.alert{border-color:#ef4444;box-shadow:0 0 14px #ef4444;}" +
                          ".cam.zoom video,.cam.zoom img{transform:scale(1.45);}" +
                          "video,img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s;}" +
                          ".lbl{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.65);padding:2px 6px;border-radius:4px;font-size:11px;}" +
                          ".badge{position:absolute;bottom:6px;right:6px;background:#dc2626;padding:2px 6px;border-radius:4px;font-size:10px;display:none;}" +
                          ".cam.alert .badge{display:block;}" +
                          "#panel{display:none;background:#1e293b;padding:12px;margin:6px;border-radius:8px;}" +
                          "input{width:100%;box-sizing:border-box;padding:8px;margin:4px 0 8px;border-radius:5px;border:1px solid #334155;background:#0f172a;color:#fff;}" +
                          "</style></head><body>" +
                          "<div class='top'><b>QO'RIQLASH NVR (10+ CAM)</b>" +
                          "<div><button class='btn' onclick='togglePanel()'>+ Sozlash</button></div></div>" +
                          "<div id='panel'>" +
                          "<input id='tgToken' placeholder='Telegram Bot Token (masalan: 123456:ABC...)'/>" +
                          "<input id='tgChat' placeholder='Telegram Chat ID (masalan: 987654321)'/>" +
                          "<input id='camUrl' placeholder='IP Kamera Snapshot/MJPEG URL (yoki bo\\'sh qoldiring)'/>" +
                          "<button class='btn' onclick='saveSettings()'>Saqlash va Kamera Qo\\'shish</button>" +
                          "</div>" +
                          "<div class='grid' id='grid'></div>" +
                          "<canvas id='cv' width='64' height='48' style='display:none'></canvas>" +
                          "<script>" +
                          "const grid=document.getElementById('grid');" +
                          "let cams=JSON.parse(localStorage.getItem('nvr_cams')||'[]');" +
                          "document.getElementById('tgToken').value=localStorage.getItem('tg_token')||'';" +
                          "document.getElementById('tgChat').value=localStorage.getItem('tg_chat')||'';" +
                          "function togglePanel(){const p=document.getElementById('panel');p.style.display=p.style.display==='block'?'none':'block';}" +
                          "function saveSettings(){" +
                          "localStorage.setItem('tg_token',document.getElementById('tgToken').value.trim());" +
                          "localStorage.setItem('tg_chat',document.getElementById('tgChat').value.trim());" +
                          "const u=document.getElementById('camUrl').value.trim();" +
                          "if(u){cams.push(u);localStorage.setItem('nvr_cams',JSON.stringify(cams));document.getElementById('camUrl').value='';}" +
                          "renderGrid();togglePanel();}" +
                          "let localStream=null,prevFrame=null,isRecording=false;" +
                          "async function initLocalCam(){" +
                          "try{localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:true});" +
                          "const v=document.getElementById('v0');if(v)v.srcObject=localStream;startMotion();}catch(e){}}" +
                          "function renderGrid(){" +
                          "grid.innerHTML='';" +
                          "let total=Math.max(10,cams.length+1);" +
                          "for(let i=0;i<total;i++){" +
                          "const d=document.createElement('div');d.className='cam';d.id='cam_'+i;" +
                          "d.onclick=()=>d.classList.toggle('zoom');" +
                          "if(i===0){d.innerHTML=\"<video id='v0' autoplay muted playsinline></video><span class='lbl'>CAM 01 (Asosiy)</span><span class='badge'>HARAKAT!</span>\";}" +
                          "else if(cams[i-1]){d.innerHTML=\"<img src='\"+cams[i-1]+\"'/><span class='lbl'>IP CAM 0\"+(i+1)+\"</span><span class='badge'>ALERT</span>\";}" +
                          "else{d.innerHTML=\"<span class='lbl'>NVR CH \"+(i+1)+\" (Bo'sh)</span>\";}" +
                          "grid.appendChild(d);}if(localStream&&document.getElementById('v0'))document.getElementById('v0').srcObject=localStream;}" +
                          "function startMotion(){" +
                          "const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),v=document.getElementById('v0');" +
                          "setInterval(()=>{" +
                          "if(!v||v.readyState<2)return;" +
                          "ctx.drawImage(v,0,0,64,48);const data=ctx.getImageData(0,0,64,48).data;" +
                          "if(prevFrame){let diff=0;for(let i=0;i<data.length;i+=16){diff+=Math.abs(data[i]-prevFrame[i]);}" +
                          "if(diff>4500){triggerAlert();}}" +
                          "prevFrame=new Uint8ClampedArray(data);},700);}" +
                          "function triggerAlert(){" +
                          "const c=document.getElementById('cam_0');c.classList.add('alert','zoom');" +
                          "setTimeout(()=>c.classList.remove('alert','zoom'),10000);" +
                          "if(!isRecording&&localStream)record10s();}" +
                          "function record10s(){" +
                          "isRecording=true;const chunks=[];const rec=new MediaRecorder(localStream);" +
                          "rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};" +
                          "rec.onstop=()=>{" +
                          "isRecording=false;const blob=new Blob(chunks,{type:'video/webm'});sendTelegram(blob);};" +
                          "rec.start();setTimeout(()=>rec.stop(),10000);}" +
                          "function sendTelegram(blob){" +
                          "const tok=localStorage.getItem('tg_token'),cid=localStorage.getItem('tg_chat');" +
                          "if(!tok||!cid)return;" +
                          "const fd=new FormData();fd.append('chat_id',cid);fd.append('video',blob,'alert.webm');" +
                          "fd.append('caption','DIQQAT! Kamerada harakat aniqlandi (10s yozuv).');" +
                          "fetch('https://api.telegram.org/bot'+tok+'/sendVideo',{method:'POST',body:fd});}" +
                          "renderGrid();initLocalCam();" +
                          "</script></body></html>";

                  webView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
                  rootLayout.addView(webView);
              }

              @Override
              public void onBackPressed() {
                  new AlertDialog.Builder(this)
                          .setTitle("Himoya rejimi")
                          .setMessage("Qo'riqlash tizimi fon rejimida faol. Chiqish uchun faollashtirish kodini kiriting.")
                          .setPositiveButton("OK", null)
                          .show();
              }

              private String sha256(String base) {
                  try {
                      MessageDigest digest = MessageDigest.getInstance("SHA-256");
                      byte[] hash = digest.digest(base.getBytes("UTF-8"));
                      StringBuilder hexString = new StringBuilder();
                      for (byte b : hash) {
                          String hex = Integer.toHexString(0xff & b);
                          if (hex.length() == 1) hexString.append('0');
                          hexString.append(hex);
                      }
                      return hexString.toString();
                  } catch (Exception ex) {
                      return "";
                  }
              }
          }
          EOF

          # ==========================================
          # 2. ADMIN APK (Qo'riqlash Admin)
          # ==========================================
          mkdir -p admin/src/main/java/uz/kuzatuv/admin

          cat << 'EOF' > admin/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="uz.kuzatuv.admin"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Qo'riqlash Admin"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".AdminActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > admin/src/main/java/uz/kuzatuv/admin/AdminActivity.java
          package uz.kuzatuv.admin;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class AdminActivity extends Activity {
              private static final String API_URL = "https://api.github.com/repos/aaaa1111bbbbv-dot/c/contents/config.json";
              private SharedPreferences prefs;
              private EditText tokenInput, codeInput, msgInput;
              private Switch activeSwitch;
              private TextView statusText;
              private String currentSha = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("AdminPrefs", MODE_PRIVATE);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#090D16"));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(48, 64, 48, 64);
                  scroll.addView(layout);

                  TextView header = new TextView(this);
                  header.setText("QO'RIQLASH ADMIN PANEL");
                  header.setTextColor(Color.parseColor("#38BDF8"));
                  header.setTextSize(22);
                  header.setTypeface(null, Typeface.BOLD);
                  header.setGravity(Gravity.CENTER);
                  layout.addView(header);

                  statusText = new TextView(this);
                  statusText.setText("Holat: Yuklanmoqda...");
                  statusText.setTextColor(Color.parseColor("#94A3B8"));
                  statusText.setPadding(0, 20, 0, 30);
                  statusText.setGravity(Gravity.CENTER);
                  layout.addView(statusText);

                  layout.addView(makeLabel("GitHub Token (ghp_...):"));
                  tokenInput = makeInput("ghp_xxxxxxxxxxxxxxxxxxxx");
                  tokenInput.setText(prefs.getString("gh_token", ""));
                  layout.addView(tokenInput);

                  activeSwitch = new Switch(this);
                  activeSwitch.setText("Mijoz ilovasi FAOL (Yoqilgan)");
                  activeSwitch.setTextColor(Color.WHITE);
                  activeSwitch.setTextSize(16);
                  activeSwitch.setChecked(true);
                  activeSwitch.setPadding(0, 24, 0, 24);
                  layout.addView(activeSwitch);

                  layout.addView(makeLabel("Faollashtirish kalit kodi (standart: Alisa):"));
                  codeInput = makeInput("Alisa");
                  codeInput.setText("Alisa");
                  layout.addView(codeInput);

                  layout.addView(makeLabel("Mijoz ekraniga xabar (ixtiyoriy):"));
                  msgInput = makeInput("Masalan: Obuna muddati tugadi...");
                  layout.addView(msgInput);

                  Button saveBtn = new Button(this);
                  saveBtn.setText("SAQLASH VA MIJOZGA YUBORISH");
                  saveBtn.setBackgroundColor(Color.parseColor("#16A34A"));
                  saveBtn.setTextColor(Color.WHITE);
                  LinearLayout.LayoutParams btnLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  btnLp.setMargins(0, 40, 0, 20);
                  saveBtn.setLayoutParams(btnLp);
                  saveBtn.setOnClickListener(v -> pushConfig());
                  layout.addView(saveBtn);

                  Button refreshBtn = new Button(this);
                  refreshBtn.setText("JORIY HOLATNI YANGILASH");
                  refreshBtn.setBackgroundColor(Color.parseColor("#1E293B"));
                  refreshBtn.setTextColor(Color.WHITE);
                  refreshBtn.setOnClickListener(v -> fetchConfig());
                  layout.addView(refreshBtn);

                  setContentView(scroll);
                  fetchConfig();
              }

              private TextView makeLabel(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.LTGRAY);
                  tv.setPadding(0, 16, 0, 8);
                  return tv;
              }

              private EditText makeInput(String hint) {
                  EditText et = new EditText(this);
                  et.setHint(hint);
                  et.setHintTextColor(Color.GRAY);
                  et.setTextColor(Color.WHITE);
                  et.setBackgroundColor(Color.parseColor("#1E293B"));
                  et.setPadding(24, 24, 24, 24);
                  return et;
              }

              private void fetchConfig() {
                  new Thread(() -> {
                      try {
                          URL url = new URL(API_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestProperty("Accept", "application/vnd.github.v3+json");
                          String tok = tokenInput.getText().toString().trim();
                          if (!tok.isEmpty()) conn.setRequestProperty("Authorization", "token " + tok);

                          BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) sb.append(line);
                          reader.close();

                          JSONObject res = new JSONObject(sb.toString());
                          currentSha = res.getString("sha");
                          String contentB64 = res.getString("content").replace("\n", "");
                          String decoded = new String(Base64.decode(contentB64, Base64.DEFAULT), "UTF-8");
                          JSONObject cfg = new JSONObject(decoded);

                          final boolean act = cfg.optBoolean("active", true);
                          final String cd = cfg.optString("code", "Alisa");
                          final String ms = cfg.optString("message", "");

                          runOnUiThread(() -> {
                              activeSwitch.setChecked(act);
                              codeInput.setText(cd);
                              msgInput.setText(ms);
                              statusText.setText("Ulandi! Joriy holat: " + (act ? "FAOL" : "O'CHIRILGAN"));
                              statusText.setTextColor(act ? Color.parseColor("#4ADE80") : Color.parseColor("#F87171"));
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              statusText.setText("Holat: Tokenni kiritib Yangilashni bosing");
                          });
                      }
                  }).start();
              }

              private void pushConfig() {
                  final String tok = tokenInput.getText().toString().trim();
                  if (tok.isEmpty()) {
                      Toast.makeText(this, "Avval GitHub Token (ghp_...) ni kiriting!", Toast.LENGTH_LONG).show();
                      return;
                  }
                  prefs.edit().putString("gh_token", tok).apply();
                  statusText.setText("Yuborilmoqda...");

                  new Thread(() -> {
                      try {
                          if (currentSha.isEmpty()) {
                              URL gUrl = new URL(API_URL);
                              HttpURLConnection gConn = (HttpURLConnection) gUrl.openConnection();
                              gConn.setRequestProperty("Authorization", "token " + tok);
                              BufferedReader r = new BufferedReader(new InputStreamReader(gConn.getInputStream()));
                              StringBuilder s = new StringBuilder();
                              String l;
                              while ((l = r.readLine()) != null) s.append(l);
                              r.close();
                              currentSha = new JSONObject(s.toString()).getString("sha");
                          }

                          JSONObject newCfg = new JSONObject();
                          newCfg.put("active", activeSwitch.isChecked());
                          newCfg.put("code", codeInput.getText().toString().trim());
                          newCfg.put("message", msgInput.getText().toString().trim());

                          String encodedContent = Base64.encodeToString(newCfg.toString(2).getBytes("UTF-8"), Base64.NO_WRAP);

                          JSONObject body = new JSONObject();
                          body.put("message", "Admin panel orqali yangilandi");
                          body.put("content", encodedContent);
                          body.put("sha", currentSha);

                          URL url = new URL(API_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("PUT");
                          conn.setRequestProperty("Authorization", "token " + tok);
                          conn.setRequestProperty("Accept", "application/vnd.github.v3+json");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setDoOutput(true);

                          OutputStream os = conn.getOutputStream();
                          os.write(body.toString().getBytes("UTF-8"));
                          os.close();

                          int code = conn.getResponseCode();
                          if (code == 200 || code == 201) {
                              BufferedReader r = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                              StringBuilder s = new StringBuilder();
                              String l;
                              while ((l = r.readLine()) != null) s.append(l);
                              r.close();
                              currentSha = new JSONObject(s.toString()).getJSONObject("content").getString("sha");

                              runOnUiThread(() -> {
                                  statusText.setText("Muvaffaqiyatli saqlandi! Mijoz 15 soniyada yangilanadi.");
                                  statusText.setTextColor(Color.parseColor("#4ADE80"));
                                  Toast.makeText(this, "Buyruq yuborildi!", Toast.LENGTH_SHORT).show();
                              });
                          } else {
                              runOnUiThread(() -> {
                                  statusText.setText("Xatolik kodi: " + code + " (Tokenni tekshiring)");
                                  statusText.setTextColor(Color.parseColor("#F87171"));
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              statusText.setText("Xatolik: " + e.getMessage());
                              statusText.setTextColor(Color.parseColor("#F87171"));
                          });
                      }
                  }).start();
              }
          }
          EOF

          # ==========================================
          # 3. IKKALA APK NI KOMPILYATSIYA VA IMZOLASH
          # ==========================================
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"

          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          build_apk() {
            DIR=$1
            OUT_NAME=$2
            mkdir -p $DIR/build/gen $DIR/build/obj $DIR/build/apk
            $BUILD_TOOLS/aapt package -f -m -J $DIR/build/gen -M $DIR/src/main/AndroidManifest.xml -I $PLATFORM
            javac -source 1.8 -target 1.8 -d $DIR/build/obj -cp $PLATFORM $(find $DIR/src $DIR/build/gen -name "*.java")
            $BUILD_TOOLS/d8 --lib $PLATFORM --output $DIR/build/apk $(find $DIR/build/obj -name "*.class")
            $BUILD_TOOLS/aapt package -f -M $DIR/src/main/AndroidManifest.xml -I $PLATFORM -F $DIR/build/unsigned.apk $DIR/build/apk
            $BUILD_TOOLS/zipalign -f 4 $DIR/build/unsigned.apk $DIR/build/aligned.apk
            $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --out out/$OUT_NAME $DIR/build/aligned.apk
          }

          build_apk "mijoz" "qoriqlash-mijoz.apk"
          build_apk "admin" "qoriqlash-admin.apk"

      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: qoriqlash-mijoz-va-admin-apk
          path: out/*.apk
